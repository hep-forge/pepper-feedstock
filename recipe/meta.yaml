{% set versions = {
    "1.12.0": "REPLACE_WITH_SHA256"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'pepper')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://gitlab.com/spice-mc/pepper/-/archive/{{ version }}/pepper-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    # TODO: Pepper needs Kokkos, HDF5 (for LHEH5), and its FORM-generated
    # process libraries -- work out the real dependency set before building.
  run:

test:
  commands:
    - echo "TODO: a real smoke test"

about:
  home: "https://gitlab.com/spice-mc/pepper"
  license: "GPL-3.0-only"
  summary: "Pepper: portable engine for the production of parton-level event records"

extra:
  recipe-maintainers:
    - meiyasan
