{% set versions = {
    "1.12.0": "49daab0f01dc198db63ad89e1cb950418c00330c8eb524a4e52af790435a9608"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'pepper')|string|lower %}

# conda-forge ships two kokkos 4.7.01 builds per arch (a cuda12 one and a
# plain hash-only CPU one) with no glob-able prefix to distinguish them
# (unlike e.g. libtorch's "cpu*" convention), and the CPU build's hash
# differs per architecture -- pin the exact per-arch CPU build string so
# the solver doesn't grab the CUDA variant. Needs bumping whenever
# conda-forge revs kokkos.
{% if aarch64 %}
{% set kokkos_pin = "4.7.01 habbe1fc_0" %}
{% else %}
{% set kokkos_pin = "4.7.01 hbbfbac7_0" %}
{% endif %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://gitlab.com/spice-mc/pepper/-/archive/{{ version }}/pepper-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}
  patches:
    - patches/0001-guard-fixmacportskokkos-with-if-apple.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - git
  host:
    # Pepper's own CMake tries find_package(Kokkos CONFIG)/find_package(pybind11
    # CONFIG) first and only falls back to vendoring a build via FetchContent if
    # not found -- conda-forge's kokkos/pybind11 satisfy those directly.
    - kokkos {{ kokkos_pin }}
    - hdf5
    - pybind11
    - python
    # EnablePybind11.cmake shells out to `python3 -c "from distutils import
    # sysconfig..."` to compute the pyper install path -- distutils was
    # removed from the stdlib in Python 3.12. setuptools' _distutils_hack
    # (auto-loaded via a .pth file at interpreter startup) redirects
    # `import distutils` to its own vendored copy, but only if setuptools
    # is actually present in the env -- it isn't guaranteed to be pulled
    # in transitively, so declare it explicitly.
    - setuptools
    - zlib
  run:
    # same exact-build pin as host:, see comment there
    - kokkos {{ kokkos_pin }}
    - hdf5
    - python

test:
  commands:
    - pepper --help

about:
  home: "https://gitlab.com/spice-mc/pepper"
  dev_url: "https://gitlab.com/spice-mc/pepper"
  license: "GPL-3.0-or-later"
  license_file: LICENSE
  summary: "Pepper: portable engine for the production of parton-level event records"
  description: |
    Pepper is a portable parton-level event generator (arXiv:2311.06198).
    This build enables Kokkos (portable on-node parallelism), HDF5 (LHEH5
    output) and Python bindings (pyper), all satisfied directly from
    conda-forge. HepMC3/LHAPDF integration is intentionally left disabled
    for now: Pepper's own CMake treats both as fully optional, and wiring
    them up would mean pulling in hep-forge's own hepmc/lhapdf packages,
    whose build strings are tied to a specific root variant Pepper itself
    has no other need for -- worth revisiting as a separate enhancement,
    not required for a working core package.

extra:
  recipe-maintainers:
    - meiyasan
